[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "LMGA_IGSA"
version = "0.1.0"
description = "Neural-guided genetic algorithm for core-to-IO mapping with a learned, IO-conditioned preemption policy."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "numpy>=1.23",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
lmga-igsa = "lmga_igsa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]